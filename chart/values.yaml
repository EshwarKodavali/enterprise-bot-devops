replicaCount: 2

image:
  repository: enterprise-bot
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: enterprise-bot
  version: "1.0.0"

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
